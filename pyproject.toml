[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meet-mirror"
version = "0.1.0"
description = "Fully-local real-time English-to-Chinese subtitle overlay for Microsoft Teams"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "TBD" }
authors = [{ name = "Joshua" }]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "soundcard>=0.4.3",
    "soundfile>=0.12",
    "faster-whisper>=1.0",
    "silero-vad>=5.1",
    "torch>=2.4",
    "llama-cpp-python>=0.3",
    "huggingface_hub>=0.20",
    "PyQt6>=6.6",
    "keyboard>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
meet-mirror = "meet_mirror.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["meet_mirror*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "gpu: tests that require a CUDA GPU and downloaded model weights",
]
